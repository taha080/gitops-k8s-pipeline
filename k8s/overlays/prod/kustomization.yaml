apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - ../../base
replicas:
  - name: demo
    count: 2
commonLabels:
  env: prod
images:
  - name: ghcr.io/taha080/gitops-k8s-pipeline-demo
    newTag: sha-59c85fd5aaab795ecda4493260048e399e5734ad
patches:
  - target:
      kind: Deployment
      name: demo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
