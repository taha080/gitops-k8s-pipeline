name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run demo app tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate manifests parse as YAML
        run: python3 -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('k8s/**/*.yaml', recursive=True)]; print('manifests OK')"

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Build both Kustomize overlays
        run: |
          kustomize build k8s/overlays/dev
          kustomize build k8s/overlays/prod

  build-and-update-prod:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gitops-k8s-pipeline-demo:sha-${{ github.sha }}

      - name: Point the prod overlay at the new image
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"
          sed -i "s/^    newTag: .*/    newTag: ${IMAGE_TAG}/" k8s/overlays/prod/kustomization.yaml
          sed -i "s/^        value: .*/        value: ${IMAGE_TAG}/" k8s/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "Deploy ${IMAGE_TAG} to prod overlay" || echo "no overlay change"
          git push
