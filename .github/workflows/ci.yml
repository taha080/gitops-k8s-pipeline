name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write
  packages: write

jobs:
  build-and-update-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests parse as YAML
        run: python3 -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('k8s/**/*.yaml', recursive=True)]; print('manifests OK')"

      - name: Build and push image to GHCR
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "ghcr.io/${{ github.repository_owner }}/gitops-k8s-pipeline-demo:${TAG}" app/
          docker push "ghcr.io/${{ github.repository_owner }}/gitops-k8s-pipeline-demo:${TAG}"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Point the prod overlay at the new image
        run: |
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" k8s/overlays/prod/kustomization.yaml
          sed -i "s/value: .*/value: ${IMAGE_TAG}/" k8s/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "Deploy ${IMAGE_TAG} to prod overlay" || echo "no overlay change"
          git push
